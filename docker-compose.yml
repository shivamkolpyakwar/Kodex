# =============================================================================
# Kodex — Docker Compose
# =============================================================================
# Services:
#   - qdrant: Vector database for RAG
#   - sandbox: Build target for the code execution sandbox image
#
# Usage:
#   docker-compose up -d qdrant        # Start Qdrant
#   docker-compose build sandbox       # Build sandbox image
# =============================================================================

services:
  # ─── Qdrant Vector Database ───────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: kodex-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Sandbox Image Builder ────────────────────────────────────────────────
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: kodex-sandbox:latest
    profiles:
      - build  # Only used for building, not running

volumes:
  qdrant_data:
    driver: local
